<!doctype html>
<html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bình luận ghim · WebView</title>
<link rel="stylesheet" href="milestones.css"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:"Segoe UI",sans-serif}
#board{position:absolute;left:50%;top:12%;transform:translateX(-50%);border:3px solid #67b4d1;background:#1d1d21;overflow:hidden;color:#f4f7fb}
#board[hidden]{display:none}h1{position:absolute;top:8px;left:0;width:100%;margin:0;text-align:center;color:#74e6ff;font-size:18px;letter-spacing:1px}
#avatar,#initial{position:absolute;transform:translate(-50%,-50%);border-radius:50%;object-fit:cover;image-rendering:auto}
#initial{display:grid;place-items:center;background:#51447d;color:white;font-weight:bold;font-size:30px}
#content{position:absolute;transform:translate(-50%,-50%);width:62%;text-align:center;overflow-wrap:anywhere}#author{position:absolute;transform:translate(-50%,-50%);text-align:center;font-weight:700}#comment{white-space:pre-wrap;margin:0;line-height:1.3}
.texture-surface h1,.texture-surface #content,.texture-surface #author{visibility:hidden}
.board-pin{position:absolute;right:12px;top:8px;width:28px;height:28px;background:#ef3434;mask:url('/icon/thumbtack-solid-full.svg') center/contain no-repeat;transform:rotate(24deg);filter:drop-shadow(2px 3px 1px #0008)}
#missionBoard{position:absolute;left:0;top:0;width:500px;height:94px}
#missionBoard[hidden]{display:none}#missionBoard .mission-card{width:500px;height:94px;min-height:94px}
</style>
<section id="board" hidden><h1>BÌNH LUẬN GHIM</h1><i class="board-pin" aria-hidden="true"></i><div id="initial"></div><img id="avatar" alt=""><div id="author"></div><div id="content"><p id="comment"></p></div></section>
<section id="missionBoard" hidden></section>
